[/Script/UnrealEd.ProjectPackagingSettings]
; Levels are reached BY NAME, not by hard reference: the title screen has no
; reference to L_EaglesLanding, and AGothicEncounterVolume travels to L_Hearth
; through an FName (ReturnHubLevelName). The cooker follows hard references only,
; so without this list a packaged build ships the default map and nothing else —
; the hub travel fails and there is no route into Eagle's Landing at all.
; Anything reachable only by name has to be listed here.
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_TitleScreen")
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_EaglesLanding")
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_Hearth")

