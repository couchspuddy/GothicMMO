-PrimaryAssetTypesToScan=(PrimaryAssetType="PrimaryAssetLabel",AssetBaseClass=/Script/Engine.PrimaryAssetLabel,bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass="/Script/Engine.World",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Maps")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="PrimaryAssetLabel",AssetBaseClass="/Script/Engine.PrimaryAssetLabel",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
; bIsEditorOnly is True on purpose, and it is load-bearing in both directions.
; GothicMMO.uproject does not enable the GameFeatures plugin, so
; /Script/GameFeatures.GameFeatureData does not exist in a cooked build: with
; bIsEditorOnly=False the packaged game scanned for it, UAssetManager::
; StartInitialLoading failed its AssetBaseClassLoaded ensure, and the game hung at
; engine init before it ever reached the front end (found packaging 0.2.0, Aug 5).
; Deleting the entry instead is NOT the fix -- the cook commandlet is an editor
; process and refuses to cook without a GameFeatureData rule ("Asset manager
; settings do not include a rule for assets of type GameFeatureData"), which fails
; the whole cook. Editor-only satisfies the cooker and skips the runtime scan.
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
bOnlyCookProductionAssets=False
bShouldManagerDetermineTypeAndName=False
bShouldGuessTypeAndNameInEditor=True
bShouldAcquireMissingChunksOnLoad=False
bShouldWarnAboutInvalidAssets=True
MetaDataTagsForAssetRegistry=()

[/Script/UnrealEd.ProjectPackagingSettings]
; Ship the MSVC runtime alongside the game instead of demanding testers install it.
;
; The game links VCRUNTIME140 / MSVCP140 dynamically, and those are not part of
; Windows — a machine that has never installed a C++ redistributable cannot launch
; the exe at all. AppLocal copies the DLLs next to the binary, so the game just
; runs: no installer, no admin rights, nothing for a tester to be talked through.
; Costs ~5 MB.
;
; The installer is included too, as a fallback for anything AppLocal does not
; cover. It needs admin, so AppLocal is the path that should normally be taken.
IncludeAppLocalPrerequisites=True
IncludePrerequisites=True
; Levels are reached BY NAME, not by hard reference: the title screen has no
; reference to L_EaglesLanding, and AGothicEncounterVolume travels to L_Hearth
; through an FName (ReturnHubLevelName). The cooker follows hard references only,
; so without this list a packaged build ships the default map and nothing else —
; the hub travel fails and there is no route into Eagle's Landing at all.
; Anything reachable only by name has to be listed here.
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_TitleScreen")
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_EaglesLanding")
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_Hearth")
+MapsToCook=(FilePath="/Game/Blueprints/Game/Levels/L_Palewood")

